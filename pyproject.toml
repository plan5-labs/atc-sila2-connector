[project]
name = "unitelabs-applied-biosystems-atc"
version = "0.1.0"
description = "A SiLA 2 connector, built on the UniteLabs CDK, for the Applied Biosystems Automated Thermal Cycler (ATC)."
readme = "README.md"
authors = [{ name = "Kozo Nishida", email = "knishida@riken.jp" }]
maintainers = [{ name = "Kozo Nishida", email = "knishida@riken.jp" }]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "unitelabs-cdk~=0.17",
    # The generated command executor stubs require at least the grpcio-tools and protobuf versions
    # they were generated with, see README.md.
    "grpcio>=1.85.1,<2",
    "protobuf>=7.35.1,<8",
]

[project.urls]
repository = "https://github.com/plan5-labs/atc-sila2-connector"
documentation = "https://github.com/plan5-labs/atc-sila2-connector/blob/main/README.md"
"Bug Tracker" = "https://github.com/plan5-labs/atc-sila2-connector/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
dev = [
    "unitelabs-cdk[dev]",
    "ruff",
    "pre-commit",
    "commitizen",
    "grpcio-tools>=1.85.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--color=yes"

[tool.ruff]
src = ["src", "tests"]
line-length = 120
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes (ruff default)
    "E",      # pycodestyle: error (ruff default: E4, E7, E9)
    "A",      # flake8-builtins
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "D",      # pydocstyle
    "D213",   # gDoc-style tweak: multi-line-summary-second-line
    "D401",   # gDoc-style tweak: non-imperative-mood
    "DOC",    # pydoclint (preview-only)
    "ANN001", # flake8-annotations: missing-type-function-argument
    "ANN201", # flake8-annotations: missing-return-type-undocumented-public-function
    "ANN202", # flake8-annotations: missing-return-type-private-function
    "ANN401", # flake8-annotations: any-type
    "EM",     # flake8-errmsg
    "BLE",    # flake8-blind-except
    "PIE",    # flake8-pie
    "SIM",    # flake8-simplify
    "PERF",   # perflint: performance
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific-rules
    "ISC",    # flake8-implicit-str-concat
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PLW",    # pylint warning
    "UP",     # py-upgrade
    "ERA",    # no commented-out code
    "FIX",    # no FIXME comments
    "T201",   # no print calls for debugging
    "S101",   # no assert
]
ignore = [
    "D100",    # undocumented-public-module
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method
    "D107",    # undocumented-public-init
    "D202",    # blank-line-after-function
    "D212",    # multi-line-summary-first-line
    "D418",    # overload-with-docstring
    "PERF203", # try-except-in-loop
]

[tool.ruff.lint.per-file-ignores]
# ignore documentation, typing, and assertions in tests
"!src/**.py" = ["D", "ANN", "ARG", "S101"]
# the tests mirror the package layout, including its `io` package
"tests/io/__init__.py" = ["A005"]
# ignore parameter name warnings in feature files
"src/unitelabs/applied_biosystems_atc/features/**/**.py" = ["D417"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = false

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 80

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
major_version_zero = true
bump_message = "chore: bump version $current_version → $new_version"

[tool.coverage.report]
exclude_also = [
    "@typing.overload",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.cruft]
skip = [
    ".venv/",
    ".git/",
    ".ruff_cache/",
    ".pytest_cache/",
    ".env",
    ".uv-cache/",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unitelabs"]

[tool.uv]
default-groups = "all"
prerelease = "if-necessary"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
