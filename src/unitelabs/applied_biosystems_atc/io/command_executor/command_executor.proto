// gRPC interface of the AutomatedThermalCyclerCommandExecutor, the Windows service that drives the ATC
// through the vendor API. Copied unchanged (apart from this header) from
// https://github.com/plan5-labs/atc-sila2/blob/main/AutomatedThermalCyclerCommandExecutor/Protos/AutomatedThermalCyclerCommandExecutorService.proto
//
// Regenerate the Python stubs after changing this file, see README.md.

syntax = "proto3";

option csharp_namespace = "AutomatedThermalCyclerCommandExecutor";

service AutomatedThermalCyclerCommandExecutorService {
    rpc Load(LoadRequest) returns (LoadResponse);
    rpc Validate(ValidateRequest) returns (ValidateResponse);
    rpc OpenLid(OpenLidRequest) returns (OpenLidResponse);
    rpc CloseLid(CloseLidRequest) returns (CloseLidResponse);
    rpc StartRun(StartRunRequest) returns (StartRunResponse);
    rpc StopRun(StopRunRequest) returns (StopRunResponse);
    rpc GetInstrumentState(GetInstrumentStateRequest) returns (GetInstrumentStateResponse);
    rpc Reset(ResetRequest) returns (ResetResponse);
    rpc SubscribeElapsedTime(SubscribeElapsedTimeRequest) returns (stream SubscribeElapsedTimeResponse);
    rpc SubscribeRemainingTime(SubscribeRemainingTimeRequest) returns (stream SubscribeRemainingTimeResponse);
    rpc SubscribeStatus(SubscribeStatusRequest) returns (stream SubscribeStatusResponse);
}

message LoadRequest {
    bytes protocolFileData = 1;
}
message LoadResponse {}

message ValidateRequest {
    bytes protocolFileData = 1;
    double maxSampleVolume = 2;
}
message ValidateResponse {}

message OpenLidRequest {}
message OpenLidResponse {}

message CloseLidRequest {}
message CloseLidResponse {}

message StartRunRequest {}
message StartRunResponse {}

message StopRunRequest {}
message StopRunResponse {}

message GetInstrumentStateRequest {}
message GetInstrumentStateResponse {
    int32 instrumentState = 1;
}

message ResetRequest {}
message ResetResponse {}

message SubscribeElapsedTimeRequest {}
message SubscribeElapsedTimeResponse {
    int64 elapsedTime = 1;
}

message SubscribeRemainingTimeRequest {}
message SubscribeRemainingTimeResponse {
    int64 remainingTime = 1;
}

message SubscribeStatusRequest {}
message SubscribeStatusResponse {
    int32 status = 1;
}
